version: 2
updates:
  # Root package.json (node-fetch, puppeteer — the setup/helper scripts at
  # the repo root, e.g. reload-agents.js, trace-message-flow.js).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bootstrap-breadcrumbs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/rcrt-dashboard-v2/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/rcrt-extension-v2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/rcrt-visual-builder"
    schedule:
      interval: "weekly"

  # The Rust workspace (crates/rcrt-core, rcrt-server, rcrt-dashboard,
  # rcrt-context-builder) — one entry at the workspace root covers every
  # member via the single Cargo.lock there.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions itself (actions/checkout, lycheeverse/lychee-action,
  # etc.) — covers .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
